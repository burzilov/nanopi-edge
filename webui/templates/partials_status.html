{{define "partials/status"}}
<div class="card">
  <p><span class="label">прокси (sing-box)</span> <span class="pill {{if eq .Active "работает"}}ok{{else}}bad{{end}}">{{.Active}}</span></p>
  <p><span class="label">время работы</span> {{.Uptime}}</p>
  <div class="row">
    <label class="vless-pick">VPN-сервер (VLESS)
      <select name="name"
              hx-post="/proxy"
              hx-trigger="change"
              hx-target="#status"
              hx-swap="innerHTML">
        {{range .All}}
        <option value="{{.}}" {{if eq . $.Proxy}}selected{{end}}>{{.}}</option>
        {{end}}
      </select>
    </label>
  </div>
  <p class="hint">Смена сервера сохраняется в конфиг и перезапускает sing-box —
    интернет может кратко моргнуть. Список серверов берётся из конфига.</p>
</div>
{{template "oob/toast" .}}
{{end}}
