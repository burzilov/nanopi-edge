{{define "home"}}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NanoPi edge</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/wan.js" defer></script>
</head>
<body>
  {{template "nav" .}}
  <main>
    <section>
      <div class="logs-head">
        <h1>Статус</h1>
        <button type="button" class="secondary" id="btn-check-updates">Проверить обновления</button>
      </div>
      <p class="hint">Состояние прокси (sing-box), выбор VPN-сервера и подключение
        NanoPi к провайдеру интернета. Данные обновляются сами каждые несколько секунд.</p>
      <div id="status"
           hx-get="/partials/status"
           hx-trigger="load, every 5s"
           hx-swap="innerHTML">
        Загрузка…
      </div>
      <div id="wan"
           hx-get="/partials/wan"
           hx-trigger="load, every 8s"
           hx-swap="innerHTML">
      </div>
    </section>
  </main>
</body>
</html>
{{end}}
