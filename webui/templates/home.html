{{define "home"}}
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NanoPi edge</title>
{{template "head"}}
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/wan.js?v={{AppVersion}}" defer></script>
</head>
<body>
  {{template "nav" .}}
  <main>
    <header class="page-header">
      <div class="page-heading">
        <h1>Статус</h1>
        <p class="page-desc">Состояние прокси (sing-box), выбор VPN-сервера и подключение
          NanoPi к провайдеру интернета. Данные обновляются сами каждые несколько секунд.</p>
      </div>
      <div class="page-actions">
        <button type="button" class="secondary" id="btn-check-updates">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg>
          Проверить обновления
        </button>
      </div>
    </header>
    <div class="dash-grid">
      <div id="status"
           hx-get="/partials/status"
           hx-trigger="load, every 5s"
           hx-swap="innerHTML">
        <div class="card card-loading">Загрузка…</div>
      </div>
      <div id="wan"
           hx-get="/partials/wan"
           hx-trigger="load, every 8s"
           hx-swap="innerHTML">
      </div>
    </div>
  </main>
</body>
</html>
{{end}}
