{{/* Общая часть <head>: тема до отрисовки (без вспышки), стили. */}}
{{define "head"}}
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1116" media="(prefers-color-scheme: dark)">
  <script>(function(){try{var t=localStorage.getItem("nanopi-theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <link rel="stylesheet" href="/static/app.css?v={{AppVersion}}">
{{end}}
