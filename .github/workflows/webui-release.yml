name: webui-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для имени артефакта (без префикса v), если не из tag"
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: webui/go.mod
          cache: false

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            v="${{ inputs.version }}"
            echo "version=v${v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Go vet + test
        env:
          GOTOOLCHAIN: auto
        run: |
          go vet ./...
          go test ./...

      - name: Build linux/amd64 + linux/arm64
        env:
          CGO_ENABLED: "0"
          GOTOOLCHAIN: auto
        run: |
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          for ARCH in amd64 arm64; do
            GOOS=linux GOARCH=$ARCH go build -trimpath \
              -ldflags="-s -w -X main.Version=${VER}" \
              -o "dist/nanopi-webui-${ARCH}" .
          done
          file dist/nanopi-webui-*
          file dist/nanopi-webui-amd64 | grep -q 'x86-64'
          file dist/nanopi-webui-arm64 | grep -q 'aarch64'
          ./dist/nanopi-webui-amd64 --version | grep -F "${VER} linux/amd64"

      - name: Pack artifacts
        id: pack
        run: |
          VER="${{ steps.ver.outputs.version }}"
          for ARCH in amd64 arm64; do
            STAGE="nanopi-webui-linux-${ARCH}"
            rm -rf "/tmp/${STAGE}"
            mkdir -p "/tmp/${STAGE}"
            cp "dist/nanopi-webui-${ARCH}" "/tmp/${STAGE}/nanopi-webui"
            cp nanopi-webui.service "/tmp/${STAGE}/"
            printf '%s\n' "$VER" > "/tmp/${STAGE}/VERSION"
            tar -C /tmp -czf "${GITHUB_WORKSPACE}/${STAGE}.tar.gz" "$STAGE"
          done
          echo "archive_amd64=nanopi-webui-linux-amd64.tar.gz" >> "$GITHUB_OUTPUT"
          echo "archive_arm64=nanopi-webui-linux-arm64.tar.gz" >> "$GITHUB_OUTPUT"
          ls -la "${GITHUB_WORKSPACE}"/nanopi-webui-linux-*.tar.gz \
            "${GITHUB_WORKSPACE}/install-singbox.sh" \
            "${GITHUB_WORKSPACE}/install-webui.sh"

      - name: Pack edge scripts
        id: pack_scripts
        working-directory: ${{ github.workspace }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          STAGE="nanopi-edge-scripts"
          mkdir -p "/tmp/${STAGE}/scripts" "/tmp/${STAGE}/templates"
          cp -r scripts/* "/tmp/${STAGE}/scripts/"
          cp -r templates/* "/tmp/${STAGE}/templates/"
          printf '%s\n' "$VER" > "/tmp/${STAGE}/VERSION"
          ARCHIVE="nanopi-edge-scripts.tar.gz"
          tar -C /tmp -czf "${GITHUB_WORKSPACE}/${ARCHIVE}" "$STAGE"
          echo "scripts_archive=${ARCHIVE}" >> "$GITHUB_OUTPUT"
          tar tzf "${GITHUB_WORKSPACE}/${ARCHIVE}"
          test "$(find /tmp/${STAGE}/scripts -type f | wc -l)" -eq 9
          test "$(find /tmp/${STAGE}/templates -type f | wc -l)" -eq 24

      - name: Upload artifacts (workflow)
        uses: actions/upload-artifact@v4
        with:
          name: nanopi-webui-linux
          path: |
            ${{ steps.pack.outputs.archive_amd64 }}
            ${{ steps.pack.outputs.archive_arm64 }}

      - name: Upload edge scripts artifact (workflow)
        uses: actions/upload-artifact@v4
        with:
          name: nanopi-edge-scripts
          path: ${{ steps.pack_scripts.outputs.scripts_archive }}

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.pack.outputs.archive_amd64 }}
            ${{ steps.pack.outputs.archive_arm64 }}
            ${{ steps.pack_scripts.outputs.scripts_archive }}
            install-singbox.sh
            install-webui.sh
          generate_release_notes: true
          body: |
            NanoPi edge + WebUI (amd64 + arm64), версия `${{ steps.ver.outputs.version }}`.

            Ассеты:
            - `nanopi-webui-linux-amd64.tar.gz` — бинарь + unit (x86_64, Debian 12/13)
            - `nanopi-webui-linux-arm64.tar.gz` — бинарь + unit (aarch64, NanoPi/Armbian)
            - `nanopi-edge-scripts.tar.gz` — scripts/ + templates (router-on, wan-*, sing-box.service, sysctl)
            - `install-webui.sh` — установщик панели
            - `install-singbox.sh` — установщик / upgrade edge (скачивает scripts bundle)

            С платы (панель «Проверить обновления») или вручную:
            ```bash
            curl -fsSL -o /opt/nanopi-edge/install-singbox.sh \
              https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.version }}/install-singbox.sh
            curl -fsSL -o /opt/nanopi-edge/install-webui.sh \
              https://github.com/${{ github.repository }}/releases/download/${{ steps.ver.outputs.version }}/install-webui.sh
            chmod +x /opt/nanopi-edge/install-singbox.sh /opt/nanopi-edge/install-webui.sh
            NANOPI_YES=1 EDGE_VERSION=${{ steps.ver.outputs.version }} bash /opt/nanopi-edge/install-singbox.sh
            WEBUI_VERSION=${{ steps.ver.outputs.version }} bash /opt/nanopi-edge/install-webui.sh --noninteractive
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
